<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 4 - Energía en Chile</title>
    <link rel="stylesheet" href="estilo_web.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #ffffff; font-family: 'Nunito', sans-serif;">

    <h1 style="color: #0f2d3c; font-family: 'Bebas Neue', sans-serif; font-size: 58px; letter-spacing: 2px;">MÓDULO 4: ENERGÍA SOLAR EN CHILE</h1>
    <p style="font-size: 18px; color: #555; margin-bottom: 30px; text-align: center; max-width: 600px;">
        Descubre cómo se distribuye la radiación solar a lo largo de nuestro país y explora las distintas zonas.
    </p>

    <!-- Este botón los saca de Web2 y los lleva al Mapa -->
    <button onclick="window.location.href='../mapa_chile_visualizacion/index.html'" style="background-color: #EF9F27; color: white; border: none; border-radius: 12px; padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s;">
        Ir al Mapa Interactivo 🗺️
    </button>

    <!-- Botón flotante IA -->
    <button onclick="abrirModalIA()" title="Pregúntale a Panelín" style="position:fixed;top:20px;right:24px;background:rgba(255,255,255,0.92);border:none;border-radius:14px;padding:6px 12px;font-size:22px;cursor:pointer;box-shadow:0 3px 12px rgba(1,87,155,0.15);z-index:100;">💡</button>

    <!-- MODAL IA PANELÍN -->
    <div class="modal-ia" id="modalIA">
        <div class="modal-ia-contenido">
            <button class="modal-ia-cerrar" onclick="cerrarModalIA()">✕</button>
            <div class="modal-ia-cabecera">
                <img src="panelin_feliz.png" class="modal-ia-img">
                <div>
                    <p class="modal-ia-titulo">¡Pregúntale a Panelín!</p>
                    <p class="modal-ia-subtitulo">Tu asistente de energía 🌟</p>
                </div>
            </div>
            <div class="modal-ia-globo" id="modalIAGlobo">
                ¡Hola! Soy Panelín 🌞 ¿Tienes alguna duda sobre la energía eléctrica o solar? ¡Escribe tu pregunta!
            </div>
            <div class="modal-ia-input-row">
                <input type="text" class="modal-ia-input" id="modalIAInput"
                       placeholder="Escribe tu pregunta aquí..."
                       onkeydown="if(event.key==='Enter') enviarPreguntaIA()">
                <button class="modal-ia-btn" id="modalIABtn" onclick="enviarPreguntaIA()">Preguntar ➜</button>
            </div>
        </div>
    </div>

    <script src="panelin_ia.js"></script>
</body>
</html>
