    <!-- Botón opcional para solo marcar como completado y seguir en el menú -->
    <button onclick="completarYVolver(4)" style="background: none; border: none; color: #888; text-decoration: underline; cursor: pointer; font-size: 14px;">
        Saltar al Módulo 4
    </button>

    <script>
        function completarYVolver(siguiente) {
            let actual = parseInt(localStorage.getItem('modulos_desbloqueados') || '1');
            if (actual < siguiente) {
                localStorage.setItem('modulos_desbloqueados', siguiente.toString());
            }
            window.location.href = 'modulos.html';
        }
    </script>
