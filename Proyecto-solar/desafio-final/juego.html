<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construye tu Central Solar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F5FAFF;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    /* Franja lateral igual que módulos */
    body::before {
      content: "";
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: clamp(8px, 0.97vw, 14px);
      background: linear-gradient(180deg, #FFD54F 0%, #FF8F00 100%);
      z-index: 200;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <script src="escena2.js"></script>
  <script>
    const region = localStorage.getItem('regionElegida') || 'norte';
    const config = {
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      parent: 'game-container',
      backgroundColor: '#F5FAFF',
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: {
        create() { this.scene.start('Escena2', { region }); }
      }
    };
    const game = new Phaser.Game(config);
    game.scene.add('Escena2', Escena2, false);
    game.scene.start('Escena2', { region });
  </script>
</body>
</html>
